<body>

<a class="skip" href="#legal-body">Skip to content</a>

<!-- logo, defined once and referenced in the header and footer -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="hpgTop" x1="0" y1="0" x2="662.881" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF1D26"/><stop offset="1" stop-color="#12699E"/>
    </linearGradient>
    <linearGradient id="hpgBot" x1="662.881" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF1D26"/><stop offset="1" stop-color="#12699E"/>
    </linearGradient>
  </defs>
  <symbol id="hpg" viewBox="0 0 663 80">{{LOGO_GLYPHS}}
    <path d="M662.881 7.67119H0V0H662.881V7.67119Z" fill="url(#hpgTop)"/>
    <path d="M0 80H662.881V72.3288H0V80Z" fill="url(#hpgBot)"/>

<header class="hdr">
  <div class="wrap hdr-in">

    </a>
    <nav class="hdr-nav">
      <a class="hdr-link" href="/#episodes">Episodes</a>
      <a class="hdr-link" href="/#states">States</a>
      <a class="hdr-cta" href="https://open.spotify.com/show/3lVeTOxvayjJ8xgR7nVGGZ" target="_blank" rel="noopener">Listen</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="legal-head">
    <div class="wrap">
      <nav class="crumb" aria-label="Breadcrumb">
        <a href="/">Home</a><span aria-hidden="true">/</span><span>{{TITLE}}</span>
      </nav>
      <h1>{{TITLE}}</h1>
      <p class="legal-date">Last updated {{UPDATED}}</p>
    </div>
  </section>

  <hr class="rule">

  <section class="sec legal-sec">
    <div class="wrap legal-grid">
      <nav class="legal-toc" aria-label="On this page">
        <p class="eyebrow">On this page</p>
        <ul>{{TOC}}</ul>
      </nav>
      <div class="legal" id="legal-body">{{BODY}}</div>
    </div>
  </section>
</main>

<footer class="ft">
  <div class="wrap">
    <div class="ft-grid">
      <div>
        <svg class="logo ft-logo" viewBox="0 0 663 80" role="img" aria-label="Heat Pump Guides"><use href="#hpg"/></svg>

      </div>
      <div class="ft-socials">{{SOCIALS}}</div>
    </div>
    <div class="ft-base">
      <p>© <span id="yr">2026</span> Heat Pump Guides</p>
      <nav class="ft-links">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="https://anchor.fm/s/f8c1cc3c/podcast/rss" target="_blank" rel="noopener">RSS</a>
      </nav>
    </div>
  </div>
</footer>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
